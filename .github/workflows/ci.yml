name: Xv6 Kernel Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-xv6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V Toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc build-essential

      - name: Compile Kernel and Userspace
        run: |
          make clean
          make kernel/kernel
          make fs.img

      - name: Run QEMU Automated Tests
        run: |
          python3 -c '
          import subprocess, time, sys

          cmd = [
              "qemu-system-riscv64",
              "-machine", "virt",
              "-bios", "none",
              "-kernel", "kernel/kernel",
              "-m", "128M",
              "-smp", "3",
              "-nographic",
              "-global", "virtio-mmio.force-legacy=false",
              "-drive", "file=fs.img,if=none,format=raw,id=x0",
              "-device", "virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0",
          ]

          proc = subprocess.Popen(
              cmd,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )

          time.sleep(2)
          proc.stdin.write("procfs_test\n")
          proc.stdin.flush()

          output = []
          start = time.time()
          passed = False
          while time.time() - start < 20:
              line = proc.stdout.readline()
              if not line:
                  break
              sys.stdout.write(line)
              output.append(line)
              if "PASS: test_proc_maps" in line:
                  passed = True
                  break

          proc.terminate()
          full_log = "".join(output)
          if not passed or "FAIL" in full_log:
              print("Automated QEMU test failed!")
              sys.exit(1)
          print("All QEMU ProcFS tests PASSED!")
          '
