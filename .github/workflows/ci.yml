name: Xv6 Kernel Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-xv6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V Toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc qemu-system-riscv build-essential

      - name: Compile Kernel and Userspace
        run: |
          make clean
          make kernel/kernel
          make fs.img

      - name: Run QEMU Automated Tests
        run: |
          python3 -c '
          import subprocess, time, sys

          cmd = [
              "qemu-system-riscv64",
              "-machine", "virt",
              "-bios", "none",
              "-kernel", "kernel/kernel",
              "-m", "128M",
              "-smp", "3",
              "-nographic",
              "-global", "virtio-mmio.force-legacy=false",
              "-drive", "file=fs.img,if=none,format=raw,id=x0",
              "-device", "virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0",
          ]

          proc = subprocess.Popen(
              cmd,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )

          time.sleep(2)
          try:
              out, _ = proc.communicate(input="procfs_test\n", timeout=20)
          except subprocess.TimeoutExpired:
              proc.kill()
              out, _ = proc.communicate()

          print(out)
          if "PASS: test_proc_maps" not in out or "FAIL" in out:
              print("Automated QEMU test failed!")
              sys.exit(1)
          print("All QEMU ProcFS tests PASSED!")
          '
